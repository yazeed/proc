<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="ambient"></div>
  <nav class="site-nav">
    <div class="nav-inner">
      <a href="{{ site.baseurl }}/" class="nav-logo">proc</a>
      <div class="nav-links">
        <a href="{{ site.baseurl }}/commands"{% if page.url contains "/commands" %} class="active"{% endif %}>commands</a>
        <a href="{{ site.baseurl }}/install"{% if page.url == "/install" %} class="active"{% endif %}>install</a>
        <a href="{{ site.baseurl }}/posts"{% if page.url == "/posts" or page.layout == "post" %} class="active"{% endif %}>posts</a>
        <a href="{{ site.baseurl }}/changelog"{% if page.url == "/changelog" %} class="active"{% endif %}>changelog</a>
        <a href="https://github.com/yazeed/proc" class="nav-github">
          <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          <span>star</span>
        </a>
      </div>
    </div>
  </nav>
  <main class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <span>{{ site.description }}</span>
      <div class="footer-links">
        <a href="https://github.com/yazeed/proc">github</a>
        <a href="https://crates.io/crates/proc-cli">crates.io</a>
        <a href="https://www.npmjs.com/package/proc-cli">npm</a>
      </div>
    </div>
  </footer>
</body>
</html>
