<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eff1f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181825" media="(prefers-color-scheme: dark)">
  {% seo %}
  {% include schema.html %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body class="{% if page.url == '/' %}is-home{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="{{ '/' | relative_url }}" class="wordmark" aria-label="proc home"><span class="wordmark-prompt" aria-hidden="true">❯</span>proc</a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/commands' | relative_url }}"{% if page.url contains "/commands" %} aria-current="page"{% endif %}>Commands</a>
        <a href="{{ '/install' | relative_url }}"{% if page.url == "/install" %} aria-current="page"{% endif %}>Install</a>
        <a href="{{ '/skill' | relative_url }}"{% if page.url == "/skill" %} aria-current="page"{% endif %}>Agent skill</a>
        <a href="{{ '/faq' | relative_url }}"{% if page.url == "/faq" %} aria-current="page"{% endif %}>FAQ</a>
        <a href="{{ '/posts' | relative_url }}"{% if page.url == "/posts" or page.layout == "post" %} aria-current="page"{% endif %}>Posts</a>
        <a href="{{ '/changelog' | relative_url }}" class="version" title="Latest release, see the changelog"{% if page.url == "/changelog" %} aria-current="page"{% endif %}>v{{ site.data.release.version }}</a>
        <a href="https://github.com/yazeed/proc-cli" class="nav-github" aria-label="proc on GitHub">
          <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
      </nav>
    </div>
  </header>
  <main id="main" class="site-main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-tagline"><span class="wordmark-prompt" aria-hidden="true">❯</span> proc v{{ site.data.release.version }}. {{ site.description }}</p>
      <nav class="footer-links" aria-label="Elsewhere">
        <a href="https://github.com/yazeed/proc-cli">GitHub</a>
        <a href="https://crates.io/crates/proc-cli">crates.io</a>
        <a href="https://www.npmjs.com/package/proc-cli">npm</a>
        <a href="https://hub.docker.com/r/yazeed/proc-cli">Docker Hub</a>
        <a href="https://github.com/yazeed/proc-cli/blob/main/LICENSE">MIT license</a>
      </nav>
    </div>
  </footer>
</body>
</html>
