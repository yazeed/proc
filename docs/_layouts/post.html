---
layout: default
---
<article>
  <div class="post-header">
    <a href="{{ site.baseurl }}/" class="post-back">&larr; posts</a>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">{{ page.date | date: "%B %d, %Y" }}</div>
    {% if page.description %}
    <p class="post-description">{{ page.description }}</p>
    {% endif %}
  </div>
  <div class="post-content">
    {{ content }}
  </div>
</article>
