---
layout: default
title: blog
---
<div class="blog-header">
  <h1>posts</h1>
</div>
<ul class="post-list">
  {% for post in site.posts %}
  <li class="post-item">
    <a href="{{ post.url | prepend: site.baseurl }}">{{ post.title }}</a>
    <div class="post-meta">{{ post.date | date: "%B %d, %Y" }}</div>
    {% if post.description %}
    <div class="post-desc">{{ post.description }}</div>
    {% endif %}
  </li>
  {% endfor %}
</ul>
